[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "butler-home-assistant"
version = "0.3.1.dev0"
description = "Reusable Home Assistant plugin for Butler runtimes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "butler-core @ git+https://github.com/keriol/butler-core.git@980df57b6615c39ccb6edc0b8e7bca9b69e550b7",
    "httpx>=0.28,<1",
    "websockets>=15,<17",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "wheel>=0.45",
]

[tool.setuptools.packages.find]
where = ["src"]
