name: Wilfred Home Assistant Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify release contract
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          VERSION="${BASH_REMATCH[1]}"

          PACKAGE_VERSION="$(
            python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text())
          print(data["project"]["version"])
          PY
          )"

          test "$PACKAGE_VERSION" = "$VERSION"

          NOTES="docs/releases/${VERSION}.md"
          test -s "$NOTES"
          grep -Fq "# Wilfred Home Assistant $VERSION" "$NOTES"

          if grep -Fq \
            'git+https://github.com/keriol/butler-wilfred.git@' \
            pyproject.toml
          then
            echo "Stable plugin release cannot depend on a Wilfred git commit."
            false
          fi

          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main

          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES=$NOTES" >> "$GITHUB_ENV"

      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install build
          python -m pip install -e ".[dev]"

      - name: Compile and test
        run: |
          python -m compileall -q src tests
          pytest -q

      - name: Build
        run: |
          python -m build
          ls -lh dist/

      - name: Clean-room
        run: |
          python -m venv /tmp/wilfred-ha-release
          source /tmp/wilfred-ha-release/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -m pip check
          python - <<'PY'
          import os
          from importlib.metadata import version
          import wilfred_home_assistant

          expected = os.environ["RELEASE_VERSION"]
          assert version("wilfred-home-assistant") == expected
          assert wilfred_home_assistant.__version__ == expected
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.whl \
            dist/*.tar.gz \
            --verify-tag \
            --title "Wilfred Home Assistant $GITHUB_REF_NAME" \
            --notes-file "$RELEASE_NOTES"
