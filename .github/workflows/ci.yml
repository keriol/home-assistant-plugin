name: Wilfred Home Assistant CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Compile and test with coverage
        run: |
          python -m compileall -q src tests
          pytest -q \
            --cov=wilfred_home_assistant \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

      - name: Build
        run: |
          python -m build
          ls -lh dist/

      - name: Clean-room wheel
        run: |
          python -m venv /tmp/wilfred-ha-clean
          source /tmp/wilfred-ha-clean/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -m pip check
          python -c "import wilfred_home_assistant; print(wilfred_home_assistant.__version__)"
